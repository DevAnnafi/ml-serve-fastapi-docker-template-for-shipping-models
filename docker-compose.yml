version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_ID: "distilbert-base-uncased-finetuned-sst-2-english"
      PORT: "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
